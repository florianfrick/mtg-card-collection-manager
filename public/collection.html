<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fbf7f2" />
  <meta name="description" content="Browse your Magic: The Gathering collection — filter by set, sort by price, and click a card to see it full size." />
  <title>MTG Collection Manager collection</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-main">
      <h1 class="brand">MTG Collection Manager <span class="sub">my collection</span></h1>
      <p class="lede">View your collection, and explore prices.</p>
      <p class="aside"><a class="cta" href="/">← Home</a></p>
    </div>
    <p class="hero-account"><span id="who"></span></p>
  </header>

  <section id="controls">
    <div class="controls">
      <label>Set
        <select id="fset"><option value="">All sets</option></select>
      </label>
      <label>Sort
        <select id="fsort">
          <option value="name">Name (A–Z)</option>
          <option value="price-desc" selected>Price (high → low)</option>
          <option value="price-asc">Price (low → high)</option>
          <option value="added">Recently added</option>
        </select>
      </label>
      <label>Finish
        <select id="ffinish">
          <option value="">All</option>
          <option value="foil">Foil</option>
          <option value="nonfoil">Non-foil</option>
        </select>
      </label>
      <label>Search
        <input id="fq" type="search" placeholder="card name" autocomplete="off" />
      </label>
      <span class="stat" id="stat"></span>
    </div>
  </section>

  <section id="econ-wrap" hidden>
    <h3>Sell plan <span class="meta" id="econ-sum"></span></h3>
    <div id="econ-insights" class="insights"></div>
    <div id="econ-buckets" class="buckets"></div>
    <div id="econ-cards"></div>
    <details id="econ-assumptions">
      <summary>Assumptions behind these numbers</summary>
      <div class="econ-form">
        <label>Platform <select id="e-platform"></select></label>
        <label>Commission % <input id="e-commission" type="number" step="0.01" min="0" max="100" /></label>
        <label>Payment fee % <input id="e-payment" type="number" step="0.01" min="0" max="100" /></label>
        <label>Per-order fee $ <input id="e-orderfee" type="number" step="0.01" min="0" /></label>
        <label>Postage per card $ <input id="e-postage" type="number" step="0.01" min="0" /></label>
        <label>Price below market % <input id="e-undercut" type="number" step="0.5" min="0" max="100" /></label>
        <label>Buylist pays % of market <input id="e-buylist" type="number" step="1" min="0" max="100" /></label>
        <label>List only if net ≥ $ <input id="e-minnet" type="number" step="0.5" min="0" /></label>
        <label>Cards I'll actually pack <input id="e-capacity" type="number" step="1" min="0" /></label>
        <div class="econ-grades" id="e-grades"></div>
        <p class="like-label" id="econ-note"></p>
      </div>
    </details>
  </section>

  <section id="value-wrap" hidden>
    <h3>Collection value over time</h3>
    <div id="portfolio"><p class="like-label">Loading price history…</p></div>
  </section>

  <section id="sets-wrap" hidden>
    <h3>Set completion <span class="meta" id="setsum"></span></h3>
    <div id="sets" class="setlist"></div>
  </section>

  <section id="grid-wrap">
    <div id="grid"></div>
    <p id="empty" class="like-label" hidden>No cards match these filters.</p>
  </section>

  <div id="lightbox" hidden></div>

  <script type="module">
    import { $, escapeHtml } from '/shared.js';

    // price is a REAL column or null; guard null before Number() (which gives 0).
    const usd = (v) => (v == null ? null : (Number.isFinite(Number(v)) ? Number(v) : null));
    const money = (v) => (v == null ? '—' : 'USD ' + v.toFixed(2));

    let all = []; // every collection entry, straight from the API

    async function load() {
      const res = await fetch('/api/collection');
      if (!res.ok) throw new Error('the server returned ' + res.status);
      all = await res.json();
      buildSetFilter();
      render();
      renderPortfolio();
      renderSets().catch((e) => console.error(e));
      loadEcon();
    }

    /** Total-value chart from /api/prices/portfolio (today matters too). */
    async function renderPortfolio() {
      const box = $('#portfolio');
      const wrap = $('#value-wrap');
      let rows = [];
      try {
        const res = await fetch('/api/prices/portfolio');
        if (res.ok) rows = await res.json();
      } catch { /* the section simply stays out of the way */ }
      // Keep each snapshot's day with its value: the x axis labels real dates,
      // not indexes, so a gap in the series still reads correctly.
      const pts = rows
        .map((p) => ({ day: p.day, v: Number(p.total_usd) }))
        .filter((p) => Number.isFinite(p.v));
      if (!pts.length) {
        wrap.hidden = true; // nothing priced yet
        return;
      }
      const vals = pts.map((p) => p.v);
      const first = vals[0], last = vals[vals.length - 1];
      const d = last - first;
      wrap.hidden = false;
      box.innerHTML =
        (pts.length > 1 ? areaChart(pts) : '') +
        `<p class="like-label"><strong>USD ${last.toFixed(2)}</strong>` +
        (pts.length > 1
          ? ` ${d >= 0 ? '▲' : '▼'} <span class="delta${d < 0 ? ' down' : ''}">${d >= 0 ? '+' : ''}USD ${d.toFixed(2)} since ${escapeHtml(pts[0].day)}</span>`
          : ` · tracking daily — the chart appears with the second snapshot`) +
        `</p>`;
    }

    /**
     * Round x "outward" to 1, 2, 5 or 10 × 10ⁿ — the building block of a
     * readable axis (never 3.7-unit gridlines).
     */
    function niceNum(x, round) {
      const mag = Math.pow(10, Math.floor(Math.log10(x)));
      const f = x / mag;
      return (round
        ? (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10)
        : (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10)) * mag;
    }

    /**
     * Axis bounds for [min, max]: nice round endpoints with ~4 ticks between
     * them. A flat series is padded so the scale never divides by zero, and a
     * flat zero series starts at 0 instead of dipping below it.
     */
    function niceTicks(min, max) {
      if (!(max > min)) {
        const pad = Math.max(Math.abs(max) * 0.1, 1);
        if (min > 0) min -= pad;
        max += pad;
      }
      const step = niceNum((max - min) / 3, true);
      const lo = Math.floor(min / step) * step;
      const hi = Math.ceil(max / step) * step;
      const n = Math.max(1, Math.round((hi - lo) / step));
      const ticks = Array.from({ length: n + 1 }, (_, i) => Number((lo + i * step).toFixed(6)));
      return { lo, hi, step, ticks };
    }

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    /** "2026-10-04" → "Oct 4" (with a short year once the series crosses years). */
    function fmtDay(day, withYear) {
      const s = String(day ?? '');
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
      if (!m) return s;
      return `${MONTHS[+m[2] - 1]} ${+m[3]}${withYear ? ` '${s.slice(2, 4)}` : ''}`;
    }

    /**
     * Area chart for a series of `{ day, v }` points, with labelled axes.
     * Inline SVG, no library: the plot stretches to the container
     * (preserveAspectRatio="none"), so the tick labels are HTML around it —
     * SVG <text> would be squashed along with the geometry. Y gets "nice"
     * round ticks on gridlines, X the snapshot dates with tick marks.
     * `h` (viewBox height) must match the CSS height of `.chart`.
     */
    function areaChart(points, { w = 560, h = 120 } = {}) {
      const vals = points.map((p) => p.v);
      const { step: yStep, ticks } = niceTicks(Math.min(...vals), Math.max(...vals));
      const lo = ticks[0], hi = ticks[ticks.length - 1];
      const top = 10, bottom = h - 6; // data band; `bottom` doubles as the x axis
      const yv = (v) => top + ((hi - v) / (hi - lo)) * (bottom - top);
      const y = (v) => yv(v).toFixed(1);
      const step = w / (points.length - 1);
      const line = vals.map((v, i) => `${(i * step).toFixed(1)},${y(v)}`).join(' ');

      // Up to five date labels across the axis, both ends always included.
      const want = Math.min(5, points.length);
      const idx = [];
      for (let k = 0; k < want; k++) {
        const i = Math.round((k * (points.length - 1)) / (want - 1));
        if (!idx.includes(i)) idx.push(i);
      }
      const dayOf = (i) => String(points[i].day ?? '');
      const withYear = dayOf(0).slice(0, 4) !== dayOf(points.length - 1).slice(0, 4);
      const xPct = (i) => ((i / (points.length - 1)) * 100).toFixed(2);

      // Decimal places: enough to tell neighbouring ticks apart, and never
      // fewer than 2 below a dollar (so $0.50, not $0.5 — and never a column
      // of $0.00 when the whole axis is measured in cents).
      let dec = 0;
      while (dec < 6 && Math.abs(yStep * 10 ** dec - Math.round(yStep * 10 ** dec)) > 1e-6) dec++;
      if (yStep < 1) dec = Math.max(dec, 2);
      const fmt = (v) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });

      return (
        `<div class="chart-frame">` +
        `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="collection value chart">` +
        // gridlines: every tick except the lowest, which is the baseline itself
        ticks.slice(1).map((t) => `<line class="grid" x1="0" y1="${y(t)}" x2="${w}" y2="${y(t)}" />`).join('') +
        `<polygon points="0,${bottom} ${line} ${w},${bottom}" fill="rgba(200,90,52,0.12)" stroke="none" />` +
        `<polyline points="${line}" fill="none" stroke="#c85a34" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />` +
        `<line class="axis" x1="0" y1="${bottom}" x2="${w}" y2="${bottom}" />` +
        idx.map((i) => {
          const x = (i * step).toFixed(1);
          return `<line class="axis" x1="${x}" y1="${bottom}" x2="${x}" y2="${bottom + 4}" />`;
        }).join('') +
        `</svg>` +
        `<div class="axis-y">` +
        // ticks reversed so the DOM reads top-to-bottom, like the axis itself
        [...ticks].reverse().map((t) => `<span style="top:${((yv(t) / h) * 100).toFixed(2)}%">${fmt(t)}</span>`).join('') +
        `</div>` +
        `<div class="axis-x">` +
        idx.map((i) => `<span style="left:${xPct(i)}%">${escapeHtml(fmtDay(points[i].day, withYear))}</span>`).join('') +
        `</div>` +
        `</div>`
      );
    }

    /**
     * Set completion: how much of each set the collection holds. The server
     * pairs the owned printings with Scryfall's printed set size, so a row reads
     * "143 / 280" — the same fraction printed on the cards. Clicking a row
     * filters the gallery to that set (the dropdown and the row stay in sync
     * because both go through `#fset`).
     */
    async function renderSets() {
      const wrap = $('#sets-wrap');
      const box = $('#sets');
      let data = null;
      try {
        const res = await fetch('/api/sets');
        if (res.ok) data = await res.json();
      } catch { /* the section simply stays out of the way */ }
      if (!data?.sets?.length) { wrap.hidden = true; return; }
      wrap.hidden = false;
      const s = data.summary;
      $('#setsum').textContent = s.complete
        ? `${s.complete} of ${s.sets} sets complete`
        : `${s.sets} ${s.sets === 1 ? 'set' : 'sets'} started`;
      box.innerHTML = '';
      for (const set of data.sets) box.appendChild(setRow(set));
    }

    /** One completion row: code, name, progress bar, owned / total, percent. */
    function setRow(set) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'setrow' + (set.complete ? ' done' : '');
      const pct = set.percent == null ? null : Math.round(set.percent * 100);
      b.title = set.total == null
        ? `${set.name}: ${set.owned} cards owned (set size unknown — no set list from Scryfall)`
        : `${set.name}: ${set.owned} of ${set.total} — click to show only this set`;
      b.innerHTML =
        `<span class="setcode">${escapeHtml(set.code)}</span>` +
        `<span class="setname">${escapeHtml(set.name)}</span>` +
        `<span class="setbar">${pct == null ? '' : `<i style="width:${Math.max(2, pct)}%"></i>`}</span>` +
        `<span class="setnum">${set.owned}${set.total == null ? '' : ` / ${set.total}`}</span>` +
        `<span class="setpct">${set.complete ? '✓ complete' : pct == null ? '—' : `${pct}%`}</span>`;
      b.addEventListener('click', () => {
        const sel = $('#fset');
        sel.value = set.code.toLowerCase();
        if (sel.value !== set.code.toLowerCase()) sel.value = ''; // not in the dropdown
        render();
        $('#grid-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      return b;
    }

    /** One <option> per distinct set actually present, with its card count. */
    function buildSetFilter() {
      const seen = new Map();
      for (const c of all) {
        const key = c.set_code || c.set_name || '';
        if (!seen.has(key)) seen.set(key, { key, name: c.set_name || c.set_code || 'Unknown set', n: 0 });
        seen.get(key).n++;
      }
      const sel = $('#fset');
      const keep = sel.value;
      sel.innerHTML = '<option value="">All sets</option>';
      for (const s of [...seen.values()].sort((a, b) => a.name.localeCompare(b.name))) {
        const o = document.createElement('option');
        o.value = s.key;
        o.textContent = `${s.name} — ${s.n}`;
        sel.appendChild(o);
      }
      sel.value = seen.has(keep) ? keep : '';
    }

    /** Apply the current filters, then sort. */
    function visible() {
      const set = $('#fset').value;
      const finish = $('#ffinish').value;
      const q = $('#fq').value.trim().toLowerCase();
      return all
        .filter((c) => !set || (c.set_code || c.set_name || '') === set)
        .filter((c) => !finish || (finish === 'foil' ? !!c.foil : !c.foil))
        .filter((c) => !q || String(c.name || '').toLowerCase().includes(q))
        .sort(comparator($('#fsort').value));
    }

    function comparator(mode) {
      const byName = (a, b) =>
        String(a.name).localeCompare(String(b.name)) ||
        String(a.collector_number || '').localeCompare(String(b.collector_number || ''), undefined, { numeric: true });
      // Unpriced cards always sink to the bottom, in either direction.
      const byPrice = (dir) => (a, b) => {
        const x = usd(a.price_usd), y = usd(b.price_usd);
        if (x == null && y == null) return byName(a, b);
        if (x == null) return 1;
        if (y == null) return -1;
        return (dir === 'asc' ? x - y : y - x) || byName(a, b);
      };
      switch (mode) {
        case 'price-asc': return byPrice('asc');
        case 'price-desc': return byPrice('desc');
        case 'added': return (a, b) => String(b.added_at).localeCompare(String(a.added_at)) || byName(a, b);
        default: return byName;
      }
    }

    function render() {
      const list = visible();
      const grid = $('#grid');
      grid.innerHTML = '';
      for (const c of list) grid.appendChild(tileEl(c));
      $('#empty').hidden = list.length > 0;

      const copies = (c) => Math.max(1, Number(c.quantity ?? 1) || 1);
      const totalCopies = (rows) => rows.reduce((s, c) => s + copies(c), 0);
      const valueOf = (rows) => rows.reduce((s, c) => {
        const v = usd(c.price_usd);
        return v == null ? s : s + v * copies(c);
      }, 0);
      const priced = list.some((c) => usd(c.price_usd) != null);
      const value = priced ? ` · USD ${valueOf(list).toFixed(2)}` : '';
      $('#stat').textContent = `${totalCopies(list)} of ${totalCopies(all)} cards${value}`;
    }

    function tileEl(c) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      const qty = Math.max(1, Number(c.quantity ?? 1) || 1);
      const grade = c.condition && c.condition !== 'NM' ? c.condition : '';
      b.title = `${c.name} — ${c.set_name || ''} #${c.collector_number || ''}${qty > 1 ? ` (×${qty})` : ''}${c.foil ? ' ✨ foil' : ''}${grade ? ` · ${grade}` : ''} (click to zoom)`;
      b.innerHTML =
        (c.image_url ? `<img loading="lazy" src="${escapeHtml(c.image_url)}" alt="" />` : '<span class="noimg"></span>') +
        (qty > 1 ? `<span class="qty">×${qty}</span>` : '') +
        (c.foil ? '<span class="foil-tag">✨</span>' : '') +
        `<span class="name">${escapeHtml(c.name)}</span>` +
        `<span class="sub">${escapeHtml((c.set_code || c.set_name || '').toUpperCase())} #${escapeHtml(c.collector_number || '')}${grade ? ` · ${escapeHtml(grade)}` : ''}</span>` +
        `<span class="price">${escapeHtml(money(usd(c.price_usd)))}</span>`;
      b.addEventListener('click', () => openLightbox(c));
      return b;
    }

    // ---- Zoom (lightbox) ----------------------------------------------------

    /**
     * Tiny sparkline for a price series. Empty when there is only one point —
     * a single point is not a trend.
     */
    function sparkline(points) {
      const vals = points.map((p) => Number(p.price_usd)).filter((v) => Number.isFinite(v));
      if (vals.length < 2) return '';
      const w = 260, h = 44;
      const min = Math.min(...vals);
      const span = Math.max(...vals) - min || 1;
      const step = w / (vals.length - 1);
      const line = vals
        .map((v, i) => `${(i * step).toFixed(1)},${(h - 5 - ((v - min) / span) * (h - 12)).toFixed(1)}`)
        .join(' ');
      return (
        `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="price history">` +
        `<polyline points="${line}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />` +
        `</svg>`
      );
    }

    /** Fill the lightbox's history pane once the series arrives. */
    async function fillHistory(c) {
      const pane = document.querySelector('#lightbox .hist');
      if (!pane) return;
      let series = [];
      try {
        const res = await fetch('/api/prices/' + encodeURIComponent(c.scryfall_id));
        if (res.ok) series = await res.json();
      } catch { /* the pane simply stays quiet */ }
      // The endpoint returns both finishes; chart the row's own finish (foil
      // rows fall back to the non-foil series on days before foil tracking).
      if (c.foil) series = series.map((p) => ({ day: p.day, price_usd: p.price_usd_foil ?? p.price_usd }));
      const vals = series.map((p) => Number(p.price_usd)).filter((v) => Number.isFinite(v));
      if (vals.length < 2) {
        const bought = usd(c.price_at_add);
        pane.innerHTML = bought == null
          ? `<p class="like-label">Tracking daily — the trend appears with the second snapshot.</p>`
          : `<p class="like-label">Added at <strong>USD ${bought.toFixed(2)}</strong> · the trend appears with the second snapshot.</p>`;
        return;
      }
      const first = vals[0], last = vals[vals.length - 1];
      const d = last - first;
      pane.innerHTML =
        sparkline(series) +
        `<p class="like-label"><strong>USD ${last.toFixed(2)}</strong> ` +
        `${d >= 0 ? '▲' : '▼'} <span class="delta${d < 0 ? ' down' : ''}">${d >= 0 ? '+' : ''}USD ${d.toFixed(2)} since ${escapeHtml(series[0].day)}</span></p>`;
    }

    function openLightbox(c) {
      const lb = $('#lightbox');
      const scry = c.set_code && c.collector_number
        ? `https://scryfall.com/card/${encodeURIComponent(c.set_code)}/${encodeURIComponent(c.collector_number)}`
        : null;
      const qty = Math.max(1, Number(c.quantity ?? 1) || 1);
      const qtyLabel = qty === 1 ? '1 copy' : `${qty} copies`;
      // Foil copies of this printing live in their own row; the control below
      // adjusts that row directly (+1 creates it) instead of flipping finishes.
      const foilRow = all.find((x) => x.scryfall_id === c.scryfall_id && !!x.foil) || null;
      const foilCount = Math.max(0, Number(foilRow?.quantity ?? 0) || 0);
      const foilCtlRow =
        `<p class="foil-ctl">✨ Foil copies ` +
            `<span class="qtystep foilstep">` +
            `<button class="foildec" aria-label="Remove a foil copy"${foilCount ? '' : ' disabled'}>◀</button>` +
            `<strong class="foilqty">${foilCount}</strong>` +
            `<button class="foiladd" aria-label="Add a foil copy">▶</button>` +
            `</span></p>`;
      // Grade lives on the row, like the finish: changing it re-grades this copy
      // (and merges into an existing row of that grade, if there is one).
      const gradeCtlRow =
        `<p class="cond-ctl">Grade ` +
        `<select class="condsel" aria-label="Card condition">` +
        ['NM', 'LP', 'MP', 'HP', 'DMG']
          .map((g) => `<option value="${g}"${(c.condition ?? 'NM') === g ? ' selected' : ''}>${g}</option>`)
          .join('') +
        `</select></p>`;
      lb.innerHTML =
        `<div class="panel" role="dialog" aria-modal="true" aria-label="${escapeHtml(c.name)}">` +
          `<button class="close" aria-label="Close">✕</button>` +
          (c.image_url ? `<img class="big" src="${escapeHtml(c.image_url)}" alt="${escapeHtml(c.name)}" />` : '') +
          `<div class="meta">` +
            `<h2>${escapeHtml(c.name)}</h2>` +
            `<p class="like-label">${escapeHtml(c.set_name || '')}` +
              `${c.collector_number ? ` #${escapeHtml(c.collector_number)}` : ''} · ${escapeHtml(money(usd(c.price_usd)))} · <strong>${escapeHtml(qtyLabel)}</strong></p>` +
            (c.foil ? '<p><span class="badge foil">✨ foil</span></p>' : '') +
            (scry ? `<p><a href="${scry}" target="_blank" rel="noopener">View on Scryfall →</a></p>` : '') +
            `<div class="hist"><p class="like-label">Loading price history…</p></div>` +
            `<p class="copies-ctl"><span class="qtystep">` +
            `<button class="dec" aria-label="Remove a copy">◀</button>` +
            `<input class="qty" type="number" inputmode="numeric" min="0" value="${qty}" ` +
            `aria-label="Copies in collection" />` +
            `<button class="addmore" aria-label="Add a copy">▶</button>` +
            `</span></p>` +
            foilCtlRow +
            gradeCtlRow +
          `</div>` +
        `</div>`;
      lb.hidden = false;
      document.body.style.overflow = 'hidden';
      lb.querySelector('.panel').addEventListener('click', (e) => e.stopPropagation());
      lb.querySelector('.close').addEventListener('click', closeLightbox);
      lb.querySelector('.dec').addEventListener('click', async () => {
        try {
          const res = await fetch('/api/collection/' + c.id + '/decrement', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ n: 1 }),
          });
          if (!res.ok) throw new Error('the server returned ' + res.status);
          const { entry } = await res.json();
          if (!entry) { closeLightbox(); await load(); return; }
          Object.assign(c, entry);
          all.splice(all.findIndex((x) => x.id === c.id), 1, entry);
          closeLightbox(); openLightbox(entry); render();
        } catch (e) {
          alert('Update failed: ' + e.message);
        }
      });
      lb.querySelector('.addmore').addEventListener('click', async () => {
        try {
          const res = await fetch('/api/collection/' + c.id, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ copies: 1 }),
          });
          if (!res.ok) throw new Error('the server returned ' + res.status);
          const { entry } = await res.json();
          Object.assign(c, entry);
          all.splice(all.findIndex((x) => x.id === c.id), 1, entry);
          closeLightbox(); openLightbox(entry); render();
        } catch (e) {
          alert('Update failed: ' + e.message);
        }
      });
      // The middle of the stepper is editable (like the upload page's): type an
      // exact total and it is PUT. Typing 0 (or ◀ on the last copy) removes the
      // row — there is no separate remove button.
      const qtyInput = lb.querySelector('.copies-ctl .qty');
      const commitTypedQty = () => {
        const raw = String(qtyInput.value).trim();
        if (raw === '' || !Number.isFinite(Math.floor(Number(raw))) || Number(raw) < 0) { qtyInput.value = String(qty); return; }
        const target = Math.floor(Number(raw));
        if (target === qty) { qtyInput.value = String(qty); return; }
        setExactQty(target);
      };
      qtyInput.addEventListener('change', commitTypedQty);
      qtyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); commitTypedQty(); } });
      // If nothing committed (e.g. Esc), put the real count back.
      qtyInput.addEventListener('blur', () => { if (qtyInput.value !== String(qty)) qtyInput.value = String(qty); });

      /** Set the exact typed total via PUT; the answer is the updated row. */
      async function setExactQty(target) {
        try {
          const res = await fetch('/api/collection/' + c.id, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ quantity: target }),
          });
          if (!res.ok) throw new Error('the server returned ' + res.status);
          const { entry, removed } = await res.json();
          if (removed || !entry) { closeLightbox(); await load(); return; }
          Object.assign(c, entry);
          all.splice(all.findIndex((x) => x.id === c.id), 1, entry);
          closeLightbox(); openLightbox(entry); render();
        } catch (e) {
          alert('Update failed: ' + e.message);
          qtyInput.value = String(qty); // restore the real count
        }
      }
      // Foil copies are their own row, so ± is a plain add/decrement against
      // that sibling (the add creates it on first use; the server deletes the
      // row when its last copy goes). Afterwards re-open on the row this
      // lightbox showed — unless the ± *was* that row and it hit zero.
      const reloadKeepingContext = async () => {
        closeLightbox();
        await load();
        const again = all.find((x) =>
          x.scryfall_id === c.scryfall_id && !!x.foil === !!c.foil && (x.condition ?? 'NM') === (c.condition ?? 'NM'));
        if (again) openLightbox(again);
      };
      lb.querySelector('.foiladd').addEventListener('click', async () => {
        try {
          const res = await fetch('/api/collection', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              scryfall_id: c.scryfall_id,
              name: c.name,
              set_name: c.set_name,
              set_code: c.set_code,
              collector_number: c.collector_number,
              rarity: c.rarity,
              image_url: c.image_url,
              // Store the foil price when Scryfall has one — not this row's price.
              price_usd: c.current_price_foil_usd ?? c.price_usd,
              foil: true,
            }),
          });
          if (!res.ok) throw new Error('the server returned ' + res.status);
          await reloadKeepingContext();
        } catch (e) {
          alert('Update failed: ' + e.message);
        }
      });
      lb.querySelector('.foildec').addEventListener('click', async () => {
        if (!foilRow) return; // disabled anyway when there are no foil copies
        try {
          const res = await fetch('/api/collection/' + foilRow.id + '/decrement', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ n: 1 }),
          });
          if (!res.ok) throw new Error('the server returned ' + res.status);
          await reloadKeepingContext();
        } catch (e) {
          alert('Update failed: ' + e.message);
        }
      });
      // Re-grading can merge this row into a sibling that already has that
      // grade, which changes the id — so reload and reopen on whatever survived
      // instead of patching the arrays in place.
      lb.querySelector('.condsel').addEventListener('change', async (e) => {
        const value = e.target.value;
        try {
          const res = await fetch('/api/collection/' + c.id + '/condition', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ condition: value }),
          });
          if (!res.ok) throw new Error('the server returned ' + res.status);
          const { entry } = await res.json();
          closeLightbox();
          await load();
          const again = entry ? all.find((x) => x.id === entry.id) : null;
          if (again) openLightbox(again);
        } catch (err) {
          alert('Update failed: ' + err.message);
        }
      });
      fillHistory(c);
    }

    function closeLightbox() {
      const lb = $('#lightbox');
      lb.hidden = true;
      lb.innerHTML = '';
      document.body.style.overflow = '';
    }

    // ---- Sell plan ---------------------------------------------------------
    //
    // The retail benchmark is already in the collection — Scryfall's price is the
    // TCGplayer market price — so this is arithmetic over rows the page already
    // has. The server owns the math (src/economics.js) and stores the
    // assumptions; this code owns the controls. Every figure is an estimate, and
    // the note under the form says so rather than pretending to precision.

    let econ = null; // last payload: { settings, plan, insights, platforms, defaults }
    let formBuilt = false;
    let showAllListed = false;

    const usd2 = (v) => (v == null ? '—' : '$' + Number(v).toFixed(2));

    async function loadEcon() {
      try {
        const res = await fetch('/api/economics');
        if (!res.ok) return;
        econ = await res.json();
        renderEcon();
      } catch { /* the section stays out of the way */ }
    }

    function renderEcon() {
      if (!econ?.plan) return;
      const wrap = $('#econ-wrap');
      wrap.hidden = !econ.plan.totals.rows;
      if (wrap.hidden) return;

      const p = econ.plan;
      const b = p.buckets;
      $('#econ-sum').textContent =
        `${usd2(p.totals.net)} if you sell both piles · ${usd2(p.totals.market)} at market`;

      $('#econ-insights').innerHTML = (econ.insights || [])
        .map((i) => `<p class="insight ${escapeHtml(i.tone)}">${escapeHtml(i.text)}</p>`)
        .join('');

      $('#econ-buckets').innerHTML =
        `<div class="bucket list">` +
          `<span class="bucket-label">List individually</span>` +
          `<strong class="bucket-net">${usd2(b.list.net)}</strong>` +
          `<span class="bucket-meta">${b.list.copies} ${b.list.copies === 1 ? 'card' : 'cards'} · ${b.list.count} ${b.list.count === 1 ? 'listing' : 'listings'}</span>` +
          `<button class="bucket-dl" data-format="tcgplayer" data-bucket="list"${b.list.count ? '' : ' disabled'}>TCGplayer inventory CSV</button>` +
        `</div>` +
        `<div class="bucket box">` +
          `<span class="bucket-label">One box to a buylist</span>` +
          `<strong class="bucket-net">${usd2(b.box.net)}</strong>` +
          `<span class="bucket-meta">${b.box.copies} ${b.box.copies === 1 ? 'card' : 'cards'} · ${b.box.count} rows</span>` +
          `<button class="bucket-dl" data-format="buylist" data-bucket="box"${b.box.count ? '' : ' disabled'}>Buylist order CSV</button>` +
          `<button class="bucket-dl ghost" data-format="list" data-bucket="box"${b.box.count ? '' : ' disabled'}>Paste-a-list .txt</button>` +
        `</div>` +
        `<div class="bucket skip">` +
          `<span class="bucket-label">Not worth shipping</span>` +
          `<strong class="bucket-net">${usd2(b.ignore.market)}</strong>` +
          `<span class="bucket-meta">${b.ignore.copies} ${b.ignore.copies === 1 ? 'card' : 'cards'} · postage costs more</span>` +
        `</div>`;

      $('#econ-buckets').querySelectorAll('.bucket-dl').forEach((btn) => {
        btn.addEventListener('click', () => downloadEcon(btn.dataset.format, btn.dataset.bucket));
      });

      // The listed cards, best gain first: what to photograph and pack.
      const rows = b.list.cards;
      const shown = showAllListed ? rows : rows.slice(0, 12);
      $('#econ-cards').innerHTML = rows.length
        ? `<table class="econ-table"><thead><tr>` +
            `<th>Card</th><th>Grade</th><th class="num">Market</th><th class="num">List at</th><th class="num">Net</th>` +
          `</tr></thead><tbody>${shown.map(econRow).join('')}</tbody></table>` +
          (rows.length > 12
            ? `<p class="like-label"><button class="more" id="econ-more">${showAllListed ? 'Show fewer' : `Show all ${rows.length}`}</button></p>`
            : '')
        : `<p class="like-label">Nothing clears the net floor right now — the whole collection belongs in one box or stays put.</p>`;
      const more = $('#econ-more');
      if (more) more.addEventListener('click', () => { showAllListed = !showAllListed; renderEcon(); });

      buildEconForm();
      fillEconForm(p.settings);
    }

    function econRow(c) {
      const grade = c.condition === 'NM' ? '' : `<span class="cond-tag">${escapeHtml(c.condition)}</span>`;
      return `<tr>` +
        `<td><span class="econ-name">${escapeHtml(c.name)}</span>` +
        `<span class="econ-sub">${escapeHtml((c.set_code || '').toUpperCase())} #${escapeHtml(c.collector_number || '')}${c.quantity > 1 ? ` ×${c.quantity}` : ''}</span></td>` +
        `<td>${grade}${c.foil ? '<span class="cond-tag foil">foil</span>' : ''}</td>` +
        `<td class="num">${usd2(c.market)}</td>` +
        `<td class="num">${usd2(c.ask)}</td>` +
        `<td class="num strong">${usd2(c.retailNet)}</td>` +
      `</tr>`;
    }

    /** Build the controls once; later renders only update their values. */
    function buildEconForm() {
      if (formBuilt || !econ?.platforms) return;
      formBuilt = true;
      $('#e-platform').innerHTML = Object.entries(econ.platforms)
        .map(([id, p]) => `<option value="${escapeHtml(id)}">${escapeHtml(p.label)}</option>`)
        .join('');
      $('#e-grades').innerHTML = ['NM', 'LP', 'MP', 'HP', 'DMG']
        .map((code) => `<label>${code} <input class="e-grade" data-code="${code}" type="number" step="0.01" min="0" max="1" /></label>`)
        .join('');
      $('#econ-note').textContent =
        'Commission and per-order fees are published rates; postage, undercut, the buylist rate and the grade multipliers are your assumptions. '
        + 'Retail figures also assume the card actually sells.';

      const num = (id, key, cast = Number) => {
        $(id).addEventListener('change', () => {
          const raw = $(id).value.trim();
          if (raw === '') return;
          saveEcon({ [key]: cast(raw) });
        });
      };
      $('#e-platform').addEventListener('change', () => saveEcon({ platform: $('#e-platform').value }));
      num('#e-commission', 'commissionPct');
      num('#e-payment', 'paymentPct');
      num('#e-orderfee', 'perOrderFee');
      num('#e-postage', 'postage');
      num('#e-undercut', 'undercutPct');
      num('#e-buylist', 'buylistRatePct');
      num('#e-minnet', 'minNet');
      num('#e-capacity', 'capacity');
      // The whole grade map goes back, not just the edited code: a partial map
      // would reset every other grade to its default.
      $('#e-grades').addEventListener('change', () => {
        const factors = {};
        $('#e-grades').querySelectorAll('.e-grade').forEach((i) => {
          if (i.value.trim() !== '') factors[i.dataset.code] = Number(i.value);
        });
        saveEcon({ conditionFactors: factors });
      });
    }

    function fillEconForm(s) {
      if (!s) return;
      const set = (id, v) => { if (document.activeElement !== $(id)) $(id).value = v; };
      $('#e-platform').value = s.platform;
      set('#e-commission', s.commissionPct);
      set('#e-payment', s.paymentPct);
      set('#e-orderfee', s.perOrderFee);
      set('#e-postage', s.postage);
      set('#e-undercut', s.undercutPct);
      set('#e-buylist', s.buylistRatePct);
      set('#e-minnet', s.minNet);
      set('#e-capacity', s.capacity);
      $('#e-grades').querySelectorAll('.e-grade').forEach((i) => {
        const v = s.conditionFactors?.[i.dataset.code];
        if (v != null && document.activeElement !== i) i.value = v;
      });
    }

    async function saveEcon(patch) {
      try {
        const res = await fetch('/api/economics/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'the server returned ' + res.status);
        econ = { ...econ, ...data };
        renderEcon();
      } catch (e) {
        $('#econ-note').textContent = 'Could not save: ' + e.message;
      }
    }

    /** A download is a plain GET with an attachment header — no blob juggling. */
    function downloadEcon(format, bucket) {
      location.href = `/api/economics/export?format=${encodeURIComponent(format)}&bucket=${encodeURIComponent(bucket)}`;
    }

    // ---- wiring -------------------------------------------------------------
    $('#fset').addEventListener('change', render);
    $('#fsort').addEventListener('change', render);
    $('#ffinish').addEventListener('change', render);
    $('#fq').addEventListener('input', render);
    $('#lightbox').addEventListener('click', closeLightbox); // click the backdrop
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    load().catch((e) => { $('#stat').textContent = 'Could not load the collection: ' + e.message; });
  </script>
</body>
</html>
